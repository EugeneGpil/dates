name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once would fight over the release directory and the containers.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    env:
      COMPOSE_PROJECT_NAME: dates
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - uses: actions/checkout@v7

      # --- environment ---------------------------------------------------

      # **Before the first `docker compose run`, and that ordering is the whole point.**
      # docker-compose.yml bind-mounts `back/.env` as a single file, and the daemon creates a
      # missing bind source as a *directory* — after which Laravel's .env is a directory and
      # every artisan command fails somewhere that does not mention it. Both files are
      # gitignored, so a fresh checkout never has them.
      - name: Write the env files
        run: |
          cp .env.example .env
          cp back/.env.example back/.env
          sed -i 's|^APP_ENV=.*|APP_ENV=testing|' back/.env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' back/.env
          sed -i 's|^# DB_HOST=.*|DB_HOST=postgres|' back/.env
          sed -i 's|^# DB_PORT=.*|DB_PORT=5432|' back/.env
          sed -i 's|^# DB_DATABASE=.*|DB_DATABASE=dates|' back/.env
          sed -i 's|^# DB_USERNAME=.*|DB_USERNAME=dates|' back/.env
          sed -i 's|^# DB_PASSWORD=.*|DB_PASSWORD=secret|' back/.env

      # --- toolchain images ----------------------------------------------

      - uses: docker/setup-buildx-action@v4

      # A fresh runner has no docker images. The php and node services declare
      # both `image:` and `build:`, and compose builds only when an image with
      # that name is missing. So these steps build ahead of time and `load` the
      # result into the runner's image store under exactly the name compose
      # looks for (`image: dates-php` implies :latest) — compose then
      # finds it and skips building.
      #
      # The point of doing it here rather than letting compose build: compose
      # cannot read the Actions cache. type=gha persists the BuildKit layers
      # between runs, which matters because the php image's apt-get +
      # docker-php-ext-install layer compiles gd, intl and the rest from
      # source — measured at 131 s cold, seconds when cached.
      - name: Build the php image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php
          tags: dates-php:latest
          load: true
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build the node image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/node
          tags: dates-node:latest
          load: true
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

      # --- backend: install, then prove it ---------------------------------

      # With dev dependencies, because PHPUnit and Pint are among them. The artifact is built
      # from a second, `--no-dev` install further down — running the suite against the vendor
      # tree that ships would mean shipping PHPUnit to the server.
      - name: Install PHP dependencies (with dev)
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/.composer \
            php composer install --prefer-dist --no-interaction --no-progress

      # The suite runs on Postgres, not on an in-memory sqlite (back/phpunit.xml says why), so
      # CI needs the same container local dev uses rather than a `services:` block — a service
      # container sits on the runner's network and `docker compose run` would not resolve it.
      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 30); do
            docker compose exec -T postgres pg_isready -U dates > /dev/null 2>&1 && break
            sleep 2
          done
          docker compose exec -T postgres createdb -U dates dates_testing

      - name: Generate the application key
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            php php artisan key:generate --no-interaction

      - name: Backend tests
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            php php artisan test

      - name: Backend formatting
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            php vendor/bin/pint --test

      # --- frontend ------------------------------------------------------

      # VITE_* values are baked into the bundle at build time, so they have to
      # exist before `npm run build`. Written as a file rather than passed as
      # env vars because Quasar resolves its own .env chain
      # (.env -> .env.local -> .env.prod -> .env.local.prod) and only `.env`
      # is guaranteed to be present on a clean CI checkout.
      #
      # VITE_API_URL is intentionally empty: the API is same-origin in
      # production (host nginx routes /api to Laravel), so src/api.js requests
      # a relative /api/... path.
      #
      # The Firebase values are secrets only in the sense that they live in the
      # repository's settings rather than in the repository. A web app config
      # identifies the project to Google and ships readable inside every client;
      # what protects the data is the id token exchange on the server
      # (docs/firebase.md). They are here because a build with them empty
      # produces a PWA whose sign-in button silently does nothing.
      - name: Write frontend env
        working-directory: front
        run: |
          cat > .env <<'EOF'
          VITE_API_URL=
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      # NPM_CONFIG_PREFIX is overridden because the image points it at /home/app, which the
      # runner's uid cannot write to.
      #
      # Same node container as local dev for all three, so the exact node version comes from
      # docker/node/Dockerfile rather than a floating runner label. Lint and vitest run before
      # the build rather than after, so a broken spec fails in seconds instead of after a full
      # bundle.
      - name: Install JS dependencies
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e NPM_CONFIG_PREFIX=/tmp/.npm-global \
            -e npm_config_cache=/tmp/.npm-cache \
            node npm ci

      - name: Frontend lint and tests
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e NPM_CONFIG_PREFIX=/tmp/.npm-global \
            -e npm_config_cache=/tmp/.npm-cache \
            node sh -c 'npm run lint && npm run test'

      - name: Build the PWA
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e NPM_CONFIG_PREFIX=/tmp/.npm-global \
            -e npm_config_cache=/tmp/.npm-cache \
            node npm run build

      - name: Fail if the service worker is missing
        run: test -f front/dist/pwa/sw.js && test -f front/dist/pwa/manifest.json

      # --- artifact ------------------------------------------------------

      # Everything above has been proven; this is what actually ships. Re-resolving without dev
      # drops PHPUnit, Pint and their trees from `back/vendor`, which the next step copies into
      # the release as-is. `--optimize-autoloader` belongs here and not on the install above,
      # where it would only have slowed the test run down.
      - name: Reinstall PHP dependencies without dev
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/.composer \
            php composer install --no-dev --prefer-dist --no-interaction \
              --no-progress --optimize-autoloader

      - name: Assemble release artifact
        run: |
          # 1. Export the tracked files into a staging dir. `git archive` writes
          #    a tar stream to stdout, so it is piped straight into tar -x; no
          #    intermediate archive file exists. Paths marked export-ignore in
          #    .gitattributes are left out; anything else new ships automatically.
          #    tar does not create the -C directory, hence the mkdir.
          mkdir -p build/release
          git archive HEAD | tar -x -C build/release

          # 2. Add the build outputs, which are not in git.
          cp -r back/vendor build/release/back/vendor

          #    /front is export-ignored, so the archive left no front/ directory
          #    behind and cp needs the parent created first.
          mkdir -p build/release/front/dist
          cp -r front/dist/pwa build/release/front/dist/pwa

          # 3. A config or route cache produced on the runner would have CI
          # absolute paths baked into it; the deploy regenerates them on the VPS.
          rm -f build/release/back/bootstrap/cache/*.php

          # 4. Pack the staging dir. -C means the tarball has no build/release/
          #    prefix, so it unpacks straight into the release directory.
          tar -czf build/release.tar.gz -C build/release .
          ls -lh build/release.tar.gz

      # --- deploy --------------------------------------------------------

      # Runs on the runner, not the server: Deployer drives the VPS over SSH.
      # Uses the PHP and Composer preinstalled in the ubuntu-24.04 runner image.
      # Pinned exactly so a Deployer release cannot change deploy behaviour
      # without a commit here.
      - name: Install Deployer
        run: |
          composer global require deployer/deployer:7.5.12 --no-interaction --no-progress

          # composer prints a "Changed current directory to …" notice, so take
          # the last line only.
          BIN="$(composer global config bin-dir --absolute 2>/dev/null | tail -n1)"

          # Called by absolute path: $GITHUB_PATH only affects later steps, so
          # `dep` is not yet resolvable from PATH inside this one.
          "$BIN/dep" --version

          echo "$BIN" >> "$GITHUB_PATH"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: dep deploy production

      # --- notification --------------------------------------------------

      # Dynamic values arrive as env vars rather than inline ${{ }} expressions:
      # an expression is pasted into the script body before the shell sees it, so
      # anything attacker-controlled reaching one would be executed.
      #
      # No parse_mode, so the subject needs no escaping and cannot break the
      # markup; Telegram auto-links the bare run URL anyway.
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set — skipping the notification."
            exit 0
          fi

          case "$JOB_STATUS" in
            success)   HEADLINE="✅ $COMPOSE_PROJECT_NAME deployed" ;;
            cancelled) HEADLINE="⚪ $COMPOSE_PROJECT_NAME deploy cancelled" ;;
            *)         HEADLINE="❌ $COMPOSE_PROJECT_NAME deploy failed" ;;
          esac

          # github.event.head_commit is absent on workflow_dispatch, so the
          # subject comes from the checked-out tree. Guarded because a failure
          # in checkout itself leaves no repository to read.
          SUBJECT="$(git log -1 --pretty=%s 2>/dev/null)" || SUBJECT=""
          COMMIT_LINE="${COMMIT_SHA:0:7}${SUBJECT:+ $SUBJECT}"

          TEXT="$(printf '%s\n%s\n%s' "$HEADLINE" "$COMMIT_LINE" "$RUN_URL")"

          BODY="$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text}')"

          if ! RESPONSE="$(curl -sS -m 30 \
                -H 'Content-Type: application/json' \
                -d "$BODY" \
                "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage")"; then
            echo "Telegram request failed; leaving the job status untouched."
            exit 0
          fi

          printf '%s' "$RESPONSE" | jq -e '.ok' >/dev/null \
            || echo "Telegram rejected the message: $RESPONSE"
