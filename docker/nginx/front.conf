server {
    listen 81;
    server_name _;
    root /var/www/front;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the manifest must never be cached by the browser,
    # otherwise clients stay pinned to an old build. Exact-match locations take
    # priority over the regex block below, which would give sw.js 30 days.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Digital Asset Links. The shipped Android app is a Capacitor WebView, and Chrome only
    # drops the URL bar from it once it can fetch /.well-known/assetlinks.json from this origin
    # and find the app's signing fingerprint in it.
    #
    # `^~` is load-bearing: a plain prefix location loses to the regex below, which would
    # deny this as a dotfile. `^~` stops nginx from ever evaluating the regex on a match.
    #
    # Five minutes, not the 30 days the block above hands every other asset: while fingerprints
    # are still being added to this file, a long cache after a key change means a URL bar that
    # nobody would connect to a deploy. Raising it to a day is reasonable once Play's own
    # app-signing fingerprint is in here and verified on a Play-installed build — until then
    # this file is still changing. A *permanent* URL bar is that missing fingerprint: Play
    # re-signs the AAB with its own key, so a Play-installed build presents a third fingerprint
    # that the debug and upload entries do not cover.
    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
